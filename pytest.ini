[pytest]
testpaths = tests
python_files = test_*.py
addopts = -p no:langsmith_plugin -p no:hydra_pytest -m "not benchmark"
norecursedirs = scratch .temp_scratch archive playground research/benchmarks/ground_truth wabb-interface node_modules
markers =
    anyio: mark test to run with anyio async runner
    benchmark: heavy academic MIR evaluation tests
